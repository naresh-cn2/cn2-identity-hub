# Continuous verification — lint, types, production build, then the four
# PowerShell QA suites against the built site served on :3000.
# Runs on Windows so the suites execute under Windows PowerShell 5.1, the
# same runtime they were authored and validated against locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Build first: next typegen emits LayoutProps and friends into
      # .next/types, which tsc needs for a clean standalone pass.
      - name: Build
        run: npm run build

      - name: Type-check
        run: npx tsc --noEmit

      - name: Serve production build
        shell: powershell
        run: |
          # Start-Process cannot execute the npm.cmd shim on Windows, so
          # launch next's bin through node.exe directly.
          $log = Join-Path $env:RUNNER_TEMP "next-start.log"
          $err = Join-Path $env:RUNNER_TEMP "next-start.err"
          $proc = Start-Process -FilePath "node" -ArgumentList "node_modules\next\dist\bin\next","start" -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError $err
          "SERVER_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:3000/" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ok) {
            Write-Host "::error::server did not come up on :3000"
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            if (Test-Path $err) { Get-Content $err -Tail 40 }
            netstat -ano | Select-String ":3000"
            exit 1
          }
          Write-Host "server up (pid $($proc.Id)) after $i s"

      - name: QA suites
        shell: powershell
        run: |
          # api-check must run first: it ends on the per-IP 429 limiter by
          # design. Every suite exits 0/1 deterministically; all four always
          # run so one run yields full signal, and failing lines are surfaced
          # as annotations (readable without log access).
          $failed = $false
          foreach ($s in @("api-check.ps1", "live-check.ps1", "hub-check.ps1", "world-check.ps1")) {
            $out = & ".\scripts\qa\$s" *>&1 | ForEach-Object { "$_" }
            $out | Write-Host
            if ($LASTEXITCODE -ne 0) {
              $bad = @($out | Where-Object { "$_" -match "FAIL|FAILED|Exception|error|At line" } | Select-Object -First 20)
              Write-Host "::error title=QA $s failed::$($bad -join ' | ')"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "all four suites green"

      - name: Stop server
        if: always()
        shell: powershell
        run: |
          if ($env:SERVER_PID) {
            Stop-Process -Id $env:SERVER_PID -Force -ErrorAction SilentlyContinue
          }
