# Continuous verification — lint, types, production build, then the four
# PowerShell QA suites against the built site served on :3000.
# Runs on Windows so the suites execute under Windows PowerShell 5.1, the
# same runtime they were authored and validated against locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Build first: next typegen emits LayoutProps and friends into
      # .next/types, which tsc needs for a clean standalone pass.
      - name: Build
        run: npm run build

      - name: Type-check
        run: npx tsc --noEmit

      # Serve and QA MUST share one step: the Windows runner wraps each
      # step in a job object and kills every descendant process when the
      # step ends, so a server started in its own step is dead before the
      # suites can reach it (observed: pid DEAD, :3000 unbound at QA start).
      - name: Serve production build and run QA suites
        shell: powershell
        run: |
          $log = Join-Path $env:RUNNER_TEMP "next-start.log"
          $err = Join-Path $env:RUNNER_TEMP "next-start.err"
          # Start-Process cannot execute the npm.cmd shim on Windows, so
          # launch next's bin through node.exe directly.
          $proc = Start-Process -FilePath "node" -ArgumentList "node_modules\next\dist\bin\next","start" -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError $err
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:3000/" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ok) {
            Write-Host "::error::server did not come up on :3000"
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            if (Test-Path $err) { Get-Content $err -Tail 40 }
            netstat -ano | Select-String ":3000"
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "server up (pid $($proc.Id)) after $i s"

          # Ground-truth probe: address resolution, per-address TCP, a
          # limiter-neutral POST, the :3000 listen table and server PID
          # liveness. Distinguishes transport failures from HTTP answers.
          function Probe([string]$tag) {
            $d = "$tag"
            try { $d += " dns=[" + (([System.Net.Dns]::GetHostAddresses("localhost") | ForEach-Object { $_.IPAddressToString }) -join ",") + "]" } catch { $d += " dns=ERR" }
            foreach ($a in @("127.0.0.1", "::1")) {
              try { $t = New-Object System.Net.Sockets.TcpClient; $t.Connect([System.Net.IPAddress]::Parse($a), 3000); $t.Close(); $d += " ${a}=OPEN" } catch { $d += " ${a}=REFUSED" }
            }
            try { $g = Invoke-WebRequest -Uri "http://localhost:3000/" -UseBasicParsing -TimeoutSec 5; $d += " GET=$($g.StatusCode)" } catch { $d += " GET=ERR" }
            try {
              $p = Invoke-WebRequest -Uri "http://localhost:3000/api/__ci-probe" -Method Post -ContentType "application/json" -Body "{}" -UseBasicParsing -TimeoutSec 5
              $d += " POST=$($p.StatusCode)"
            } catch {
              $pc = $null
              try { $pc = $_.Exception.Response.StatusCode.value__ } catch { }
              if ($pc) { $d += " POST=HTTP $pc" } else { $d += " POST=REFUSED" }
            }
            $listen = "none"
            try { $listen = ((Get-NetTCPConnection -LocalPort 3000 -ErrorAction Stop | ForEach-Object { "$($_.LocalAddress):$($_.State):pid$($_.OwningProcess)" } | Sort-Object -Unique) -join "; ") } catch { }
            $d += " listen=[$listen]"
            $alive = "alive"
            if (-not (Get-Process -Id $proc.Id -ErrorAction SilentlyContinue)) { $alive = "DEAD" }
            $d += " pid=$($proc.Id):$alive"
            Write-Host "connectivity $d"
            return $d
          }
          $connDiag = (Probe "pre")

          # api-check must run first: it ends on the per-IP 429 limiter by
          # design. Every suite exits 0/1 deterministically; all four always
          # run so one run yields full signal, and failing lines are surfaced
          # as annotations (readable without log access).
          $failed = $false
          foreach ($s in @("api-check.ps1", "live-check.ps1", "hub-check.ps1", "world-check.ps1")) {
            $out = & ".\scripts\qa\$s" *>&1 | ForEach-Object { "$_" }
            $out | Write-Host
            if ($LASTEXITCODE -ne 0) {
              $bad = @($out | Where-Object { "$_" -match "FAIL|FAILED|Exception|error|At line|diag|connectivity" } | Select-Object -First 25)
              $diag = $connDiag + " || " + ($bad -join ' | ')
              foreach ($f in @("next-start.log", "next-start.err")) {
                $p = Join-Path $env:RUNNER_TEMP $f
                if (Test-Path $p) { $diag += "`n--- $f tail ---`n" + ((Get-Content $p -Tail 40) -join "`n") }
              }
              Write-Host ("::error title=QA $s failed::" + $diag.Replace("`r", "%0A").Replace("`n", "%0A"))
              $failed = $true
            }
          }

          if ($failed) {
            $postProbe = (Probe "post")
            Write-Host ("::error title=QA connectivity summary::" + $postProbe.Replace("`r", "%0A").Replace("`n", "%0A"))
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "all four suites green"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
