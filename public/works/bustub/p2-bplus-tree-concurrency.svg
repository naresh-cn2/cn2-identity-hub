<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrow2-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#ef4444"/>
    </marker>
    <linearGradient id="p2-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0b111e"/>
    </linearGradient>
    <linearGradient id="p2-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="12" fill="url(#p2-bg)" stroke="#1e293b" stroke-width="1.5"/>

  <g stroke="#1f2937" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="267" y1="0" x2="267" y2="600"/>
    <line x1="533" y1="0" x2="533" y2="600"/>
  </g>

  <!-- Left: B+ Tree Structure -->
  <rect x="30" y="80" width="230" height="320" rx="8" fill="url(#p2-surface)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="110" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">B+ TREE INDEX</text>
  <text x="50" y="130" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">dynamic split/coalesce/borrow rebalancing</text>

  <!-- Root -->
  <rect x="120" y="150" width="60" height="34" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="150" y="172" fill="#10b981" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" text-anchor="middle" font-weight="700">ROOT</text>
  <text x="150" y="158" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">[12, 28]</text>

  <!-- Internal -->
  <rect x="50" y="220" width="60" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="80" y="242" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" text-anchor="middle">[12]</text>
  <rect x="190" y="220" width="60" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="220" y="242" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" text-anchor="middle">[28]</text>

  <!-- Leaves -->
  <rect x="20" y="290" width="60" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="50" y="312" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">[3, 7]</text>
  <rect x="110" y="290" width="60" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="140" y="312" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">[15, 22]</text>
  <rect x="200" y="290" width="60" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="230" y="312" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">[31, 40]</text>
  <rect x="290" y="290" width="60" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="320" y="312" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">[45, 50]</text>

  <!-- Leaf links -->
  <line x1="80" y1="324" x2="140" y2="324" stroke="#10b981" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="170" y1="324" x2="260" y2="324" stroke="#10b981" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="260" y1="324" x2="350" y2="324" stroke="#10b981" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Tree edges -->
  <line x1="150" y1="184" x2="80" y2="220" stroke="#334155" stroke-width="1.5"/>
  <line x1="150" y1="184" x2="220" y2="220" stroke="#334155" stroke-width="1.5"/>
  <line x1="80" y1="254" x2="50" y2="290" stroke="#334155" stroke-width="1.5"/>
  <line x1="80" y1="254" x2="140" y2="290" stroke="#334155" stroke-width="1.5"/>
  <line x1="220" y1="254" x2="230" y2="290" stroke="#334155" stroke-width="1.5"/>
  <line x1="220" y1="254" x2="320" y2="290" stroke="#334155" stroke-width="1.5"/>

  <!-- Right: Latch Crabbing Protocol -->
  <rect x="285" y="80" width="485" height="320" rx="8" fill="url(#p2-surface)" stroke="#334155" stroke-width="1"/>
  <text x="305" y="110" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">LATCH CRABBING PROTOCOL</text>
  <text x="305" y="130" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">optimistic read/write latching · safe-ancestor release</text>

  <g transform="translate(305, 160)">
    <text x="0" y="0" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700">STEP 1</text>
    <text x="40" y="0" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">acquire R-Latch(root)</text>
    <line x1="120" y1="2" x2="150" y2="2" stroke="#334155" stroke-width="1" marker-end="url(#arrow2)"/>
    <text x="160" y="0" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">R-Latch(child)</text>
    <line x1="250" y1="2" x2="280" y2="2" stroke="#334155" stroke-width="1" marker-end="url(#arrow2)"/>
    <text x="290" y="0" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">check IsSafePage()</text>
  </g>

  <g transform="translate(305, 190)">
    <text x="0" y="0" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700">STEP 2</text>
    <text x="40" y="0" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">child safe? → release ancestor latches</text>
    <line x1="220" y1="2" x2="250" y2="2" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow2-red)"/>
    <text x="260" y="0" fill="#ef4444" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">RETAIN for split/merge</text>
  </g>

  <g transform="translate(305, 220)">
    <text x="0" y="0" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700">STEP 3</text>
    <text x="40" y="0" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">leaf reached → modify · unlatch · unpin</text>
  </g>

  <!-- Lock modes mini-matrix -->
  <rect x="305" y="270" width="200" height="110" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="320" y="290" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700">LOCK MODE MATRIX</text>
  <g transform="translate(320, 305)">
    <text x="0" y="0" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">IS</text>
    <text x="30" y="0" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">IX</text>
    <text x="60" y="0" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">S</text>
    <text x="90" y="0" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">SIX</text>
    <text x="120" y="0" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">X</text>
    <text x="0" y="18" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">IS</text>
    <text x="0" y="36" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">IX</text>
    <text x="0" y="54" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">S</text>
    <text x="0" y="72" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">SIX</text>
    <text x="0" y="90" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">X</text>
  </g>

  <rect x="520" y="270" width="240" height="110" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="535" y="290" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700">FORWARD ITERATOR</text>
  <text x="535" y="308" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">next_page_id doubly-linked leaf chain</text>
  <g transform="translate(535, 325)">
    <rect x="0" y="0" width="40" height="20" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="20" y="13" fill="#10b981" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">LEAF</text>
    <line x1="45" y1="10" x2="65" y2="10" stroke="#10b981" stroke-width="2" marker-end="url(#arrow2)"/>
    <rect x="70" y="0" width="40" height="20" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="90" y="13" fill="#10b981" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">LEAF</text>
  </g>

  <!-- Footer telemetry -->
  <rect x="30" y="500" width="740" height="70" rx="8" fill="#0b111e" stroke="#334155" stroke-width="1"/>
  <text x="50" y="525" fill="#22c55e" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700">✓ 13/13 TESTS PASSED</text>
  <text x="250" y="525" fill="#10b981" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700">6/6 MULTI-THREADED STRESS</text>
  <text x="470" y="525" fill="#3b82f6" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700">19275ad</text>
  <text x="50" y="550" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">Concurrent B+ Tree · latch crabbing · 19275ad · P2</text>
</svg>