<svg xmlns="http://www.w3.org/2000/svg" width="660" height="150" viewBox="0 0 660 150" fill="none">
  <defs>
    <linearGradient id="p3-bg" x1="0" y1="0" x2="660" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="p3-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="660" height="150" rx="10" fill="url(#p3-bg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="0" y="0" width="6" height="150" rx="3" fill="url(#p3-accent)"/>

  <!-- Badge / Tag -->
  <rect x="24" y="18" width="80" height="22" rx="4" fill="#4c1d95" fill-opacity="0.4" stroke="#7c3aed" stroke-width="1"/>
  <text x="34" y="33" fill="#c4b5fd" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">PROJECT 3</text>

  <!-- Title -->
  <text x="116" y="34" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Query Execution &amp; Optimizer</text>

  <!-- Description -->
  <text x="24" y="65" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400">
    Volcano iterator model (Seq/Index Scan, Insert, Update, Delete, HashJoin, Aggregations) •
  </text>
  <text x="24" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400">
    Rule-based optimizer (NLJ-to-HashJoin, SeqScan-to-IndexScan, Sort+Limit-to-TopN).
  </text>

  <!-- Metrics row -->
  <line x1="24" y1="104" x2="636" y2="104" stroke="#1f2937" stroke-width="1"/>

  <g transform="translate(24, 114)">
    <!-- Metric 1 -->
    <text x="0" y="16" fill="#10b981" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700">✓ 21/21</text>
    <text x="56" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">SQLLogicTests</text>

    <!-- Metric 2 -->
    <text x="170" y="16" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700">Heuristic Optimizer</text>
    <text x="305" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Rule Transforms</text>

    <!-- Metric 3 -->
    <text x="430" y="16" fill="#a855f7" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700">a56e622</text>
    <text x="490" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Verified Commit</text>
