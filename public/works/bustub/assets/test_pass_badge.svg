<svg xmlns="http://www.w3.org/2000/svg" width="380" height="44" viewBox="0 0 380 44" fill="none">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="380" height="44" rx="8" fill="url(#grad-bg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left icon: database shield -->
  <g transform="translate(14, 12)">
    <circle cx="10" cy="10" r="9" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
    <path d="M6 10.5L9 13.5L14 7.5" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="44" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">CMU 15-445 BUSTUB</text>

  <!-- Divider -->
  <line x1="195" y1="12" x2="195" y2="32" stroke="#334155" stroke-width="1.5"/>

  <!-- Status pill -->
  <rect x="208" y="10" width="158" height="24" rx="12" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <circle cx="221" cy="22" r="4" fill="#34d399" filter="url(#glow)"/>
  <text x="232" y="26.5" fill="#ecfdf5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.3">ALL 4 PROJECTS 100%</text>
</svg>

