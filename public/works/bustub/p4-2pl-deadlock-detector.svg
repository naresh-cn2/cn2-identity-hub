<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <marker id="arrow4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow4-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#ef4444"/>
    </marker>
    <linearGradient id="p4-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0b111e"/>
    </linearGradient>
    <linearGradient id="p4-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="12" fill="url(#p4-bg)" stroke="#1e293b" stroke-width="1.5"/>

  <g stroke="#1f2937" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="267" y1="0" x2="267" y2="600"/>
    <line x1="533" y1="0" x2="533" y2="600"/>
  </g>

  <!-- Left: Lock Mode Compatibility Matrix -->
  <rect x="30" y="80" width="230" height="320" rx="8" fill="url(#p4-surface)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="110" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">5-MODE LOCK MATRIX</text>
  <text x="50" y="130" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">IS · IX · S · SIX · X compatibility</text>
  <g transform="translate(50, 160)">
    <text x="0" y="0" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">      IS IX S SIX X</text>
    <text x="0" y="18" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">IS  ✓ ✓ ✓ ✓ ✗</text>
    <text x="0" y="36" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">IX  ✓ ✓ ✗ ✗ ✗</text>
    <text x="0" y="54" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">S   ✓ ✗ ✓ ✗ ✗</text>
    <text x="0" y="72" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">SIX ✓ ✗ ✗ ✓ ✗</text>
    <text x="0" y="90" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">X   ✗ ✗ ✗ ✗ ✗</text>
  </g>

  <!-- Lock modes legend -->
  <g transform="translate(50, 230)">
    <text x="0" y="0" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700">LOCK MODES</text>
    <text x="0" y="22" fill="#f59e0b" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">IS</text>
    <text x="30" y="22" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">Intent Shared</text>
    <text x="0" y="44" fill="#f59e0b" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">IX</text>
    <text x="30" y="44" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">Intent Exclusive</text>
    <text x="0" y="66" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">S</text>
    <text x="30" y="66" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">Shared</text>
    <text x="0" y="88" fill="#a855f7" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">SIX</text>
    <text x="30" y="88" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">Shared+Intent Ex</text>
    <text x="0" y="110" fill="#ef4444" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">X</text>
    <text x="30" y="110" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">Exclusive</text>
  </g>

  <!-- Center: 2PL State Machine -->
  <rect x="285" y="80" width="230" height="260" rx="8" fill="url(#p4-surface)" stroke="#334155" stroke-width="1"/>
  <text x="305" y="110" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">STRICT 2PL STATE</text>
  <text x="305" y="130" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">GROWING → SHRINKING</text>
  <g transform="translate(305, 160)">
    <rect x="0" y="0" width="70" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="35" y="20" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" text-anchor="middle">GROWING</text>
    <line x1="75" y1="15" x2="95" y2="15" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow4)"/>
    <rect x="100" y="0" width="70" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="135" y="20" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" text-anchor="middle">SHRINKING</text>
  </g>
  <g transform="translate(305, 200)">
    <text x="0" y="0" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">REPEATABLE_READ: all S/X locks</text>
    <text x="0" y="22" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">held until COMMIT/ABORT</text>
    <text x="0" y="44" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">READ_COMMITTED: S locks released</text>
    <text x="0" y="66" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">after read, X locks to COMMIT</text>
    <text x="0" y="88" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">READ_UNCOMMITTED: no S locks</text>
  </g>

  <!-- Center-right: LockManager -->
  <rect x="540" y="80" width="230" height="160" rx="8" fill="url(#p4-surface)" stroke="#334155" stroke-width="1"/>
  <text x="560" y="110" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">LOCK MANAGER</text>
  <text x="560" y="130" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">table & row multi-granularity 2PL</text>
  <g transform="translate(560, 160)">
    <text x="0" y="20" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">FIFO LockRequestQueue</text>
    <text x="0" y="42" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">in-place lock upgrades</text>
    <text x="0" y="64" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">upgrading_ priority flag</text>
  </g>

  <!-- Right: Deadlock Detector -->
  <rect x="30" y="420" width="230" height="150" rx="8" fill="url(#p4-surface)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="448" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">DEADLOCK DETECTOR</text>
  <text x="50" y="468" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">background DFS cycle detection</text>
  <g transform="translate(50, 490)">
    <circle cx="20" cy="15" r="8" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>
    <text x="20" y="19" fill="#f8fafc" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">T1</text>
    <line x1="32" y1="15" x2="58" y2="15" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow4-red)"/>
    <circle cx="70" cy="15" r="8" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>
    <text x="70" y="19" fill="#f8fafc" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">T2</text>
    <line x1="82" y1="15" x2="108" y2="15" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow4-red)"/>
    <circle cx="120" cy="15" r="8" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>
    <text x="120" y="19" fill="#f8fafc" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">T3</text>
    <line x1="132" y1="15" x2="158" y2="15" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow4-red)"/>
    <line x1="158" y1="15" x2="28" y2="15" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow4-red)"/>
    <text x="90" y="40" fill="#dc2626" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">CYCLE: T1→T2→T3→T1</text>
    <text x="90" y="58" fill="#dc2626" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">ABORT victim = max(txn_id)</text>
  </g>

  <!-- Center-right bottom: Cycle Detector daemon -->
  <rect x="285" y="360" width="230" height="110" rx="8" fill="url(#p4-surface)" stroke="#334155" stroke-width="1"/>
  <text x="305" y="388" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">CYCLE DETECTION DAEMON</text>
  <g transform="translate(305, 410)">
    <text x="0" y="20" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">wakes every cycle_detection_interval_</text>
    <text x="0" y="42" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">builds waits-for graph from active queues</text>
    <text x="0" y="64" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">deterministic DFS → abort youngest txn</text>
  </g>

  <!-- Footer telemetry -->
  <rect x="30" y="500" width="740" height="70" rx="8" fill="#0b111e" stroke="#334155" stroke-width="1"/>
  <text x="50" y="525" fill="#22c55e" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700">✓ 11/11 CONCURRENCY SUITES</text>
  <text x="310" y="525" fill="#f59e0b" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700">DEADLOCK RESOLUTION</text>
  <text x="520" y="525" fill="#3b82f6" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700">0ce5626</text>
  <text x="50" y="550" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">Multi-Granularity 2PL · cycle detection · 0ce5626 · P4</text>
</svg>