<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#06b6d4"/>
    </marker>
    <linearGradient id="p1-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0b111e"/>
    </linearGradient>
    <linearGradient id="p1-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="12" fill="url(#p1-bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Grid -->
  <g stroke="#1f2937" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="267" y1="0" x2="267" y2="600"/>
    <line x1="533" y1="0" x2="533" y2="600"/>
  </g>

  <!-- Left column: BufferPoolManager -->
  <rect x="30" y="80" width="230" height="320" rx="8" fill="url(#p1-surface)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="110" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">BUFFERPOOLMANAGER</text>
  <text x="50" y="130" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">page_id → frame_id · pin_count · dirty_bit · RWLatch</text>

  <rect x="50" y="150" width="190" height="6" rx="3" fill="#1e293b"/>
  <g transform="translate(50, 165)">
    <text x="0" y="0" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">PAGE_ID</text>
    <text x="70" y="0" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">FRAME</text>
    <text x="120" y="0" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">PIN</text>
    <text x="155" y="0" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">DIRTY</text>
  </g>
  <rect x="50" y="185" width="190" height="8" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <g transform="translate(55, 192)">
    <text x="0" y="0" fill="#3b82f6" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">0x4a</text>
    <text x="70" y="0" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">F7</text>
    <text x="120" y="0" fill="#22c55e" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">2</text>
    <text x="155" y="0" fill="#ef4444" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">✓</text>
  </g>
  <rect x="50" y="205" width="190" height="8" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <g transform="translate(55, 212)">
    <text x="0" y="0" fill="#3b82f6" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">0x8c</text>
    <text x="70" y="0" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">F2</text>
    <text x="120" y="0" fill="#22c55e" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">1</text>
    <text x="155" y="0" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">—</text>
  </g>

  <!-- LRU-K Replacer -->
  <rect x="30" y="420" width="230" height="150" rx="8" fill="url(#p1-surface)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="448" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">LRU-K REPLACER</text>
  <text x="50" y="468" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">backward K-distance · O(1) lookup</text>
  <g transform="translate(50, 488)">
    <rect x="0" y="0" width="30" height="20" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="15" y="14" fill="#3b82f6" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" text-anchor="middle">HIST</text>
    <line x1="35" y1="10" x2="55" y2="10" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="60" y="0" width="30" height="20" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="75" y="14" fill="#3b82f6" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" text-anchor="middle">CACHE</text>
    <line x1="95" y1="10" x2="115" y2="10" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="120" y="0" width="30" height="20" rx="4" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>
    <text x="135" y="14" fill="#f8fafc" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" text-anchor="middle">EVICT</text>
  </g>

  <!-- Center: DiskScheduler -->
  <rect x="285" y="80" width="230" height="220" rx="8" fill="url(#p1-surface)" stroke="#334155" stroke-width="1"/>
  <text x="305" y="110" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">DISKSCHEDULER</text>
  <text x="305" y="130" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">std::promise/std::future request queue</text>
  <g transform="translate(305, 150)">
    <rect x="0" y="0" width="30" height="30" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="15" y="20" fill="#06b6d4" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" text-anchor="middle" font-weight="700">REQ</text>
    <line x1="35" y1="15" x2="55" y2="15" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)"/>
    <rect x="60" y="0" width="70" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="95" y="20" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" text-anchor="middle">worker thread pool</text>
  </g>
  <text x="305" y="195" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">asynchronous disk I/O →</text>
  <rect x="305" y="210" width="70" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="340" y="235" fill="#06b6d4" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" text-anchor="middle">DISK</text>
  <text x="340" y="250" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">manager</text>

  <!-- Right column: Page Frames -->
  <rect x="540" y="80" width="230" height="220" rx="8" fill="url(#p1-surface)" stroke="#334155" stroke-width="1"/>
  <text x="560" y="110" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">PAGE FRAMES</text>
  <text x="560" y="130" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">in-memory slot cache</text>
  <g transform="translate(560, 150)">
    <rect x="0" y="0" width="40" height="50" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">F0</text>
    <rect x="100" y="0" width="40" height="50" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="120" y="30" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">F1</text>
    <rect x="0" y="60" width="40" height="50" rx="4" fill="#3b82f6" stroke="#0ea5e9" stroke-width="1"/>
    <text x="20" y="80" fill="#f8fafc" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">F2</text>
    <rect x="100" y="60" width="40" height="50" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="120" y="80" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">F3</text>
  </g>

  <!-- Arrows -->
  <line x1="260" y1="240" x2="285" y2="190" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="265" y="230" fill="#3b82f6" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">pin page</text>
  <line x1="400" y1="240" x2="540" y2="190" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="465" y="230" fill="#06b6d4" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="middle">schedule I/O</text>

  <!-- Footer telemetry -->
  <rect x="30" y="500" width="740" height="70" rx="8" fill="#0b111e" stroke="#334155" stroke-width="1"/>
  <text x="50" y="525" fill="#22c55e" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700">✓ 11/11 TESTS PASSED</text>
  <text x="250" y="525" fill="#3b82f6" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700">fc821a8</text>
  <text x="330" y="525" fill="#a855f7" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700">ASAN 0 LEAKS</text>
  <text x="50" y="550" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">LRU-K Buffer Pool · fc821a8 · P1 Buffer Pool Manager</text>
</svg>