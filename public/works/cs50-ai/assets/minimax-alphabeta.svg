<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" fill="none">
  <defs>
    <linearGradient id="mm-bg" x1="0" y1="0" x2="960" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#101623"/>
    </linearGradient>
    <linearGradient id="mm-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="960" height="500" rx="12" fill="url(#mm-bg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="0" y="0" width="960" height="6" rx="3" fill="url(#mm-accent)"/>

  <text x="32" y="52" fill="#f8fafc" font-family="Consolas, monospace" font-size="15" font-weight="700" letter-spacing="2">TIC-TAC-TOE — MINIMAX WITH ALPHA-BETA PRUNING</text>
  <text x="32" y="74" fill="#64748b" font-family="Consolas, monospace" font-size="11" letter-spacing="1">GAME TREE SEARCH · α = BEST GUARANTEED SCORE FOR MAX · β = BEST FOR MIN · PRUNE WHEN α ≥ β</text>

  <!-- level labels -->
  <g font-family="Consolas, monospace" font-size="10" fill="#475569" letter-spacing="1">
    <text x="60" y="130">MAX (X)</text>
    <text x="240" y="130">MIN (O)</text>
    <text x="420" y="130">MAX (X)</text>
    <text x="600" y="130">TERMINAL</text>
  </g>
  <line x1="32" y1="110" x2="700" y2="110" stroke="#1f2937" stroke-width="1"/>

  <!-- root -->
  <rect x="46" y="150" width="60" height="40" rx="6" fill="#0d1322" stroke="#2563eb" stroke-width="2"/>
  <text x="76" y="175" fill="#93c5fd" font-family="Consolas, monospace" font-size="12" text-anchor="middle">s₀</text>

  <!-- level 1 -->
  <rect x="226" y="150" width="60" height="40" rx="6" fill="#0d1322" stroke="#334155" stroke-width="1.2"/>
  <text x="256" y="175" fill="#94a3b8" font-family="Consolas, monospace" font-size="11" text-anchor="middle">s₁</text>
  <rect x="226" y="220" width="60" height="40" rx="6" fill="#0d1322" stroke="#334155" stroke-width="1.2"/>
  <text x="256" y="245" fill="#94a3b8" font-family="Consolas, monospace" font-size="11" text-anchor="middle">s₂</text>
  <rect x="226" y="290" width="60" height="40" rx="6" fill="#0d1322" stroke="#334155" stroke-width="1.2"/>
  <text x="256" y="315" fill="#94a3b8" font-family="Consolas, monospace" font-size="11" text-anchor="middle">s₃</text>

  <!-- level 2 -->
  <rect x="406" y="130" width="60" height="40" rx="6" fill="#0d1322" stroke="#334155" stroke-width="1.2"/>
  <text x="436" y="155" fill="#94a3b8" font-family="Consolas, monospace" font-size="11" text-anchor="middle">s₄</text>
  <rect x="406" y="200" width="60" height="40" rx="6" fill="#0d1322" stroke="#334155" stroke-width="1.2"/>
  <text x="436" y="225" fill="#94a3b8" font-family="Consolas, monospace" font-size="11" text-anchor="middle">s₅</text>
  <rect x="406" y="280" width="60" height="40" rx="6" fill="#0d1322" stroke="#334155" stroke-width="1.2"/>
  <text x="436" y="305" fill="#94a3b8" font-family="Consolas, monospace" font-size="11" text-anchor="middle">s₆</text>

  <!-- terminals -->
  <g font-family="Consolas, monospace" font-size="12" text-anchor="middle">
    <rect x="586" y="120" width="60" height="34" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
    <text x="616" y="142" fill="#86efac">+1</text>
    <rect x="586" y="176" width="60" height="34" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="616" y="198" fill="#fca5a5">−1</text>
    <rect x="586" y="240" width="60" height="34" rx="6" fill="#0d1322" stroke="#334155" stroke-width="1.2"/>
    <text x="616" y="262" fill="#94a3b8">0</text>
    <rect x="586" y="300" width="60" height="34" rx="6" fill="#0d1322" stroke="#334155" stroke-width="1.2"/>
    <text x="616" y="322" fill="#94a3b8">0</text>
  </g>

  <!-- edges: root to level1 -->
  <line x1="106" y1="170" x2="226" y2="170" stroke="#1e3a5f" stroke-width="1.2"/>
  <line x1="106" y1="172" x2="226" y2="240" stroke="#1e3a5f" stroke-width="1.2"/>
  <line x1="106" y1="174" x2="226" y2="310" stroke="#1e3a5f" stroke-width="1.2"/>
  <!-- level1 to level2 -->
  <line x1="286" y1="168" x2="406" y2="150" stroke="#1e3a5f" stroke-width="1.2"/>
  <line x1="286" y1="170" x2="406" y2="220" stroke="#1e3a5f" stroke-width="1.2"/>
  <line x1="286" y1="242" x2="406" y2="292" stroke="#1e3a5f" stroke-width="1.2"/>
  <!-- level2 to terminals -->
  <line x1="466" y1="145" x2="586" y2="137" stroke="#1e3a5f" stroke-width="1.2"/>
  <line x1="466" y1="150" x2="586" y2="193" stroke="#1e3a5f" stroke-width="1.2"/>
  <line x1="466" y1="222" x2="586" y2="257" stroke="#1e3a5f" stroke-width="1.2"/>
  <line x1="466" y1="300" x2="586" y2="317" stroke="#1e3a5f" stroke-width="1.2"/>

  <!-- pruning cut -->
  <line x1="286" y1="315" x2="470" y2="315" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="492" y="319" fill="#fca5a5" font-family="Consolas, monospace" font-size="11">✂ PRUNED — α ≥ β</text>

  <!-- backpropagation arrows (utilities) -->
  <g font-family="Consolas, monospace" font-size="10.5" fill="#86efac">
    <text x="290" y="200">↑ β = min(+1, −1) = −1</text>
    <text x="110" y="205">↑ α = max(−1) = −1</text>
  </g>

  <!-- metrics -->
  <line x1="32" y1="376" x2="928" y2="376" stroke="#1f2937" stroke-width="1"/>
  <g font-family="Consolas, monospace" font-size="11.5">
    <text x="32" y="402" fill="#38bdf8" font-weight="700">9! = 362,880</text>
    <text x="170" y="402" fill="#64748b">full game tree leaves without pruning</text>
    <text x="470" y="402" fill="#10b981" font-weight="700">≈ 30,000</text>
    <text x="570" y="402" fill="#64748b">evaluations with α/β pruning</text>
    <text x="32" y="424" fill="#a855f7" font-weight="700">b → √b</text>
    <text x="120" y="424" fill="#64748b">effective branching factor under optimal move ordering</text>
    <text x="470" y="424" fill="#38bdf8" font-weight="700">GUARANTEE</text>
    <text x="580" y="424" fill="#64748b">never loses — at minimum a draw</text>
  </g>
  <text x="32" y="472" fill="#475569" font-family="Consolas, monospace" font-size="10" letter-spacing="1">UTILITY: X WINS +1 · O WINS −1 · DRAW 0 — COMPUTED FROM THE SPECIFICATION IN PROJECTS/tic-tac-toe.md</text>
</svg>
