  <text x="32" y="52" fill="#f8fafc" font-family="Consolas, 'IBM Plex Mono', monospace" font-size="15" font-weight="700" letter-spacing="2">ARTIFICIAL INTELLIGENCE — SIX PARADIGMS / TWELVE PROJECTS</text>
  <text x="32" y="74" fill="#64748b" font-family="Consolas, 'IBM Plex Mono', monospace" font-size="11" letter-spacing="1">HARVARD CS50AI · CURRICULUM ARCHITECTURE MAP</text>

  <!-- Row 1: reasoning -->
  <g>
    <rect x="32" y="100" width="278" height="190" rx="8" fill="#0d1322" stroke="#1e3a5f" stroke-width="1"/>
