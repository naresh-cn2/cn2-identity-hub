    <text x="357" y="208" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">04 · Minesweeper — subset inference</text>
    <text x="357" y="238" fill="#64748b" font-family="Consolas, monospace" font-size="10">sound + complete for propositional logic</text>
  </g>
  <g>
