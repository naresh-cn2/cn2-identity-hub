      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#101623"/>
    </linearGradient>
    <linearGradient id="pm-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" rx="12" fill="url(#pm-bg)" stroke="#1e293b" stroke-width="1.5"/>
